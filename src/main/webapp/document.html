<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Document</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">
<link href="css/main.css" rel="stylesheet">
</head>

<body>
	<header>
		<nav class="navbar navbar-dark fixed-top">
			<img src="resources/images/polimi_logo_horizontal_white.png"
				height="60" width="auto">
			<div class="d-flex flex-row my-1"  style="margin-right:10px">
				<!--    <p th:text="${session.utente.username}" class="h4 navbar-brand font-weight-normal my-1">USERNAME</p> -->
				<a th:href="@{/Logout}"><button
						class="btn btn-outline-light my-1" type="submit">Logout</button></a>
			</div>
		</nav>
	</header>
	<div class="scrollable-content">
	<div style="margin-top: 90px; margin-left: 10px;">
		<form th:action="@{/GoBack}" method="get">
			<input type="hidden" name="sourcePage" th:value="'document.html'" />
			<button type="submit" class="btn btn-outline-light my-1 go-page-btn">Go to parent folder</button>
			<input type="hidden" name="documentID" th:value="${documentID}" />
		</form>
	</div>

	<div style="position: absolute; margin-top: 43px; margin-left: 10px">
		<h2>Document Information</h2>
		<table class="table">
			<tr>
				<td class="align-top"><h5>Document name:</h5></td>
				<td><span th:text="${documentName}"></span></td>
			</tr>
			<tr>
				<td class="align-top"><h5>Creation date:</h5></td>
				<td><span
					th:text="${#dates.format(creationDate, 'dd/MM/yyyy HH:mm:ss')}"></span></td>
			</tr>
			<tr>
				<td class="align-top"><h5>Document summary:</h5></td>
				<td><span th:text="${summary}"></span></td>
			</tr>
			<tr>
				<td class="align-top"><h5>Document type:</h5></td>
				<td><span th:text="${documentType}"></span></td>
			</tr>
			<tr>
				<td class="align-top"><h5>Folder :</h5></td>
				<td><span th:text="${folderName}"></span></td>
			</tr>
		</table>
	</div>
	</div>
</body>
</html>
