<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Document Manager</title>

  	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">  
    <link href="css/main.css" rel="stylesheet">
</head>
<body>
	
    <nav class="navbar navbar-dark fixed-top">
        <img src="resources/images/polimi_logo_horizontal_white.png" height="60" width="auto">
        <div class="d-flex flex-row my-1"  style="margin-right:10px">
        <!--    <p th:text="${session.utente.username}" class="h4 navbar-brand font-weight-normal my-1">USERNAME</p> -->
            <a th:href="@{/Logout}"><button class="btn btn-outline-light my-1" type="submit">Logout</button></a>
        </div>
    </nav>
	<div class="scrollable-content">
        <h1 style="margin-top: 85px; margin-left:13px;">Homepage</h1>
	<div th:if="${!isMovingAction}">
		<div style="position: absolute; top: 85px; right: 10px">
			<a th:href=@{/OpenContentManager}><button
					class="btn btn-outline-light btn-round my-1 go-page-btn">Content Manager</button></a>
		</div>

		<div style="position: absolute; top: 140px;">
			<!-- Chiamata iniziale per stampare l'albero -->
			<ul>
				<li th:replace=":: printTree(${folderTree})"></li>
			</ul>
		</div>

	</div>


	<div th:if="${isMovingAction}">
		<div class="message-box" style="position: absolute">
			Stai spostando il documento <span th:text="${documentName}"></span>,
			dalla cartella <span th:text="${originFolderName}"></span>. Scegli la
			cartella di destinazione.
		</div>
		<div style="position: absolute; margin-top: 180px;">
			<!-- Chiamata iniziale per stampare l'albero -->
			<ul>
				<li th:replace=":: printTree(${folderTree})"></li>
			</ul>
		</div>
	</div>



	<!-- Definizione della funzione ricorsiva Thymeleaf -->
	<div th:block th:fragment="printTree(node)">
	
		<div th:if="${node != null}" >
		<!-- Stampa dell'albero normale; dunque non in fase di spostamento di un documento -->
		<div
			th:if="${!isMovingAction and node.folder.depth > folderTree.folder.depth}">
			<a th:href="@{/GoToFolder(folderID=${node.folder.folderID})}">
				<button class="folder-btn"><span th:text="${node.folder.folderName}"></span></button>
			</a>
		</div>
		
		<!-- Stampa dell'albero in fase di spostamento di un documento: evita di mettere il link alla cartella di provenienza del doc -->
		<div th:if="${isMovingAction and node.folder.folderID == originFolderID and node.folder.depth > folderTree.folder.depth}">
			<button class="folder-btn" disabled><span th:text="${node.folder.folderName}"></span></button>
		</div>
		
		<!-- Stampa dell'albero in fase di spostamento di un documento: mette i vari link alle altre cartelle -->
		<div th:if="${isMovingAction and node.folder.folderID != originFolderID and node.folder.depth > folderTree.folder.depth}">
			<a th:href="@{/MoveDocument(destinationFolderID=${node.folder.folderID}, documentID=${documentID})}">
			<button class="folder-btn"><span th:text="${node.folder.folderName}"></span></button>
			</a>
		</div>

		<ul th:if="${node.children}">
			<li th:each="child : ${node.children}">
				<div th:replace=":: printTree(${child})"></div>
			</li>
		</ul>
	</div>
	</div>
	</div>

</body>
</html>
