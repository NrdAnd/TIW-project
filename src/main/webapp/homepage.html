<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Document Manager</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">
<link href="css/main.css" rel="stylesheet">
<script src="javascript/utils.js" charset="utf-8" defer></script>
<script src="javascript/homepage.js" charset="utf-8" defer></script>
</head>
</head>
<body>

<div id="globalPage">
	<header>
		<nav class="navbar navbar-dark fixed-top">
			<img src="resources/images/polimi_logo_horizontal_white.png"
				height="60" width="auto">
			<div class="d-flex flex-row my-1" style="margin-right: 10px">
				<button id="Logout" class="btn btn-outline-light my-1" type="submit">Logout</button>
			</div>
		</nav>
	</header>

	<div style="margin-top: 10px" class="main-title">
		<div style="margin-top: 100px; display: flex; align-items: center; justify-content: space-between;">
			<h1 style="margin-left: 13px;">Homepage</h1>
		</div>
			<button id="EditButton" type="button"
				class="btn btn-outline-light btn-round my-1 go-page-btn"
				style="margin-right: 10px; margin-left: 10px;">Edit</button>
			<button id="RootButton" type="button"
				class="btn btn-outline-light btn-round my-1 go-page-btn">Root
				Button</button>
			<img id="wasteBin" src="resources/images/trash_icon.png" height="40" width="auto" style="float:right; margin-right:10px">
	</div>
		<div id="rightContainer" class="right-div"></div>
		<div class="left-div">
		<div class="clt">
			<div class="wrap">
				<div id="treeContainer"></div>
			</div>
		</div>
			<p id="treeError"></p>
		</div>

		<div id="documentDetails">
			<h3>Document details:</h3>
			<h4>Name:</h4>
			<p id="documentName"></p>
			<h4>Format:</h4>
			<p id="documentFormat"></p>
			<h4>Summary:</h4>
			<p id="documentSummary"></p>
			<h4>Creation date:</h4>
			<p id="documentDate"></p>
			<input class="HideDetails" type="button" id="hideDetails" value="Hide Details">
		</div>

		<form id="createFolder" action="#" class="creation-form">
			<h3 id="createFolderFormTitle">Create a Folder</h3>
			<label for="folderName"></label> <input type="text"
				id="folderName" name="newFolderName" placeholder="Folder Name" maxlength="25" required class="text-input"> <br> 
				<input type="submit" id="createFld"
				value="Create Folder"
				class="btn btn-outline-light btn-round my-1 go-page-btn">
		</form>

		<form id="createDocument" action="#" class="creation-form">
    		<h3 id="createDocumentTitle">Create a Document</h3>
    		<label for="docName"></label>
    			<input type="text" id="docName" name="docName" maxlength="25" placeholder="Document Name" required class="text-input"><br>
    		<label for="docFormat"></label>
    			<input type="text" id="docFormat" name="docFormat" maxlength="5" placeholder="Format" pattern="^[^\s.]{1,10}$" required class="text-input"><br>
    		<label for="docSummary"></label>
    			<textarea id="docSummary" name="docSummary" rows="3" maxlength="250" placeholder="Summary" required class="text-input"></textarea>
    		<br>
    		<input type="submit" id="createDoc" value="Create Document" class="btn btn-outline-light btn-round my-1 go-page-btn">
		</form>

	</div>
</body>
</html>
