<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign up</title>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
            crossorigin="anonymous">
        <link href="css/access.css" rel="stylesheet">
        
        </head>
  <body>
    <div class="center">
      <h1>Login</h1>
      <form action="CheckLoginCredentials" method="POST">
        <div class="txt_field">
          <input type="text" name="username" required>
          <span></span>
          <label>Username</label>
        </div>
        <div class="txt_field">
          <input type="password" name="password" required>
          <span></span>
          <label>Password</label>
        </div>
        <p th:text="${errorMsg}" th:class="'alert alert-danger'"></p>
        <button type="submit" class="btn btn-lg btn-light btn-main">Login</button>
      </form>
      <a href="signup.html">
        <button class="btn btn-lg btn-light btn-secondary">Sign Up</button>
      </a>
    </div>

  </body>
</html>
