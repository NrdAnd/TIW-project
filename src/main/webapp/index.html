<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link href="css/signin.css" rel="stylesheet">
    <link rel="icon" href="resources/images/polimi_icon.png">
    <script src="javascript/utils.js" charset="utf-8" defer></script>
    <script src="javascript/login.js" charset="utf-8" defer></script>
</head>
<body class="text-center">
    <div class="form-signin wrapper">
        <img class="mb-4" src="resources/images/polimi_logo.png" alt="" width="240" height="auto">
        <br><br>
        <h1 class="h3 mb-3 font-weight-normal">
            Login
        </h1>
        <br>

        <form action="#" class="form-signin">
            <input type="text" name="username" class="form-control" placeholder="Username" required><br>
            <input type="password" name="password" class="form-control" placeholder="Password" required><br>
            <button id = "login-button" class="btn btn-lg btn-primary btn-block">Login</button>
        </form>

        <p id = "errorMessage" class = "alert alert-danger" hidden></p>
        <a href="signup.html"><button class="btn btn-lg btn-light">Sign up</button></a>
    </div>
</body>
</html>
