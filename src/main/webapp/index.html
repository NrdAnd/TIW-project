	<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link href="css/access.css" rel="stylesheet">
    <link rel="icon" href="resources/images/polimi_icon.png">
    <script src="javascript/utils.js" charset="utf-8" defer></script>
    <script src="javascript/login.js" charset="utf-8" defer></script>
</head>
<body>
    <div class="center">
    	<div style="margin-bottom: 20px;"></div>
   	 	<div class="image-container">
        	<img class="mb-4 centered-image" src="resources/images/polimi_logo.png" alt="Polimi Logo" width="240" height="auto">
    	</div>
        <h1 class="h3 mb-3 font-weight-normal">
            Login
        </h1>
	<div class="txt_field">
        <form action="#" class="form-signin">
			<input id="username" type="text" name="username" class="form-control centered-input" placeholder="Username" maxlength="25" required><br>
			<input id="password" type="password" name="password" class="form-control centered-input" placeholder="Password" maxlength="25" required><br>
            <button id = "login-button" class="btn btn-lg btn-light btn-main">Login</button>
        </form>

        <p id = "errorMessage" class = "alert alert-danger" hidden></p>
        <a href="signup.html"><button class="btn btn-lg btn-light btn-secondary">Sign up</button></a>
    </div>
    </div>
</body>
</html>
