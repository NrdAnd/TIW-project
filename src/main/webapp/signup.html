<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link href="css/access.css" rel="stylesheet">
    <link rel="icon" href="resources/images/polimi_icon.png">
    <script src="javascript/utils.js" charset="utf-8" defer></script>
    <script src="javascript/register.js" charset="utf-8" defer></script>
</head>
<body>

<div class="center">
<div class="form-signin wrapper">
   	 	<div class="image-container">
        	<img class="mb-4 centered-image" src="resources/images/polimi_logo.png" alt="Polimi Logo" width="240" height="auto">
    	</div>
    <h1 class="h3 mb-3 font-weight-normal">Sign up</h1>

    <form id="registerForm" action="CheckSignupCredentials" method="POST" class="form-signin">
        <input id="username" type="text" name="username" class="form-control centered-input" placeholder="Username" required><br>
        <input id="email" type="email" name="email" class="form-control centered-input" placeholder="Email" required><br>
        <input id = "pswd1" type="password" name="password" class="form-control centered-input" placeholder="Password" required><br>
        <input id = "pswd2" type="password" name="passwordCheck" class="form-control centered-input" placeholder="Ripeti password" required><br>
        <button id="register-button" class="btn btn-lg btn-light btn-main">Sign up</button>
    </form>
    
    <a href="index.html"><button class="btn btn-lg btn-light btn-secondary">Login</button></a>
    <p id = "errorMessage" class = "alert alert-danger" hidden></p>
    
</div>
</div>

</body>
</html>
