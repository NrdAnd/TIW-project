<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Content Manager</title>

  	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">  
    <link href="css/main.css" rel="stylesheet">
</head>
<body>
	<header>
		<nav class="navbar navbar-dark fixed-top">
			<img src="resources/images/polimi_logo_horizontal_white.png"
				height="60" width="auto">
			<div class="d-flex flex-row my-1"  style="margin-right:10px">
				<!--    <p th:text="${session.utente.username}" class="h4 navbar-brand font-weight-normal my-1">USERNAME</p> -->
				<a th:href="@{/Logout}" class="logout-link">
					<button class="btn btn-outline-light my-1 logout-btn" type="submit">Logout</button>
				</a>
			</div>
		</nav>
	</header>
	<div class="scrollable-content">
	<div style="margin-top: 90px; margin-left: 10px;">
		<form th:action="@{/GoBack}" method="get">
			 <a th:href="@{/GoBack}" class="go-back-link">
				<button class="btn btn-outline-light my-1 go-page-btn" type="submit">Go to Homepage</button>
			</a>
		</form>
	</div>
	<br>
	<div style="margin-left: 10px">
	<h1>New Folder</h1>

	<!-- Form per creare una nuova cartella -->
	<form th:action="@{/CreateFolder}" method="get">
		<input type="text" name="newFolderName" class="form-control"
			placeholder="Folder Name" required><br> <label
			for="parentFolder">Destination</label> 
			<select name="destinationID" required class="custom-select">
			<!-- Loop attraverso le cartelle estratte dal database -->
			<option th:each="folder : ${folderList}"
				th:value="${folder.folderID}" th:text="${folder.folderName}"></option>
		</select> <br> <br>
		<button type="submit" class="btn btn-outline-light btn-round my-1 internal-btn">Create
			Folder</button>
	</form>
	<br>


	<h1>New Document</h1>

	<!-- Form per creare un nuovo documento -->
	<form th:action="@{/CreateDocument}" method="post">
		<input type="text" name="newDocumentName" class="form-control"
			placeholder="Document Name" required><br> <input
			type="text" name="summary" class="form-control" placeholder="Summary"
			required><br> <input type="text" name="documentType"
			class="form-control" placeholder="Type" required><br> 
			<label for="cartella">Select Folder</label> 
			<select name="destinationID" required class="custom-select">
			<option value="">Seleziona...</option>
			<!-- Loop sulla lista delle cartelle per generare le opzioni -->

			<option th:each="folder : ${folderList}" th:if="${folder.depth >= 1}"
				th:value="${folder.folderID}" th:text="${folder.folderName}"></option>
		</select> <br> <br>
		<button type="submit" class="btn btn-outline-light btn-round my-1 internal-btn">Create
			Document</button>
	</form>
	</div>
	</div>
</body>
</html>
